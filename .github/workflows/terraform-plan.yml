name: Terraform Plan

on:
  push:
    branches:
      - "features/action-pipeline"

  pull_request:
    branches:
      - "features/action-pipeline"

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: ./env/prod

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan